[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uup2iso"
version = "0.1.22"
description = "UUP -> ISO 构建与精简工具（Windows 10/11 x64，PySide6 + PyInstaller）"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "UUP2ISO" }]
keywords = ["windows", "uup", "iso", "dism", "wimlib"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

# 运行期依赖（WP0-T2）。
# 说明：Fluent 控件库必须使用 PySide6 变体，否则会与 PySide6 并存两套 Qt 绑定。
dependencies = [
  "PySide6>=6.8,<7",
  "PySide6-Fluent-Widgets>=1.7,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "typer>=0.12,<1",
  "jsonschema>=4.23,<5",
  "lxml>=5.3,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-qt>=4.4,<5",
  "dirty-equals>=0.8,<1",
  "ruff>=0.7",
  "mypy>=1.13",
  "pyinstaller>=6.10,<7",
]

[project.scripts]
uup2iso = "uup2iso.cli.main:main"

[project.gui-scripts]
uup2iso-gui = "uup2iso.gui.app:main"

[tool.setuptools]
package-dir = { "" = "src" }
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["uup2iso*"]

[tool.setuptools.package-data]
uup2iso = ["schemas/*.json"]

# ---------------------------------------------------------------------------
# 工具链（全部由 .venv 内的解释器执行，见 docs/治理/版本与变更管理.md §2）
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "gui: 需要 Qt 绑定与离屏（offscreen）平台的测试",
]
filterwarnings = ["error::DeprecationWarning:uup2iso.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RET", "PTH", "TID"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
files = ["src"]
# src/ 布局：显式声明导入根，避免依赖「已安装到 site-packages」才能解析自身包
mypy_path = "src"
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["qfluentwidgets.*", "qfluentwidgets", "jsonschema.*", "jsonschema", "lxml.*", "lxml"]
# jsonschema 官方未提供 py.typed；只用到 Draft7Validator，忽略缺失 stub 即可（不引入 types-jsonschema）
ignore_missing_imports = true
